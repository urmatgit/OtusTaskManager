# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml
 stages:
  - build
  - test
  - deploy

  variables:
    DOTNET_VERSION: "8.0.x"
    PROJECT_NAME: "UserService.Api"
    PROJECT_PATH: "src/UserService.Api"
    POSTGRES_VERSION: "15-alpine"
    POSTGRES_DB: "taskboardDb"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"

  # Cache NuGet packages and build outputs
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/
    - **/bin/
    - **/obj/

services:
  - name: postgres:$POSTGRES_VERSION
    alias: postgres
    variables:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

before_script:
  - export DATABASE_URL="Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
  - dotnet --version
  - dotnet restore

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet build "$PROJECT_PATH" --configuration Release --no-restore
  artifacts:
    paths:
      - "$PROJECT_PATH/bin/Release/**/*"


unit_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet test "src/UserService.Business.xUnitTests" --configuration Release --no-build --verbosity normal

migrate_database:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - echo "Waiting for PostgreSQL to be ready..."
    - timeout 30s bash -c 'until pg_isready -h postgres -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 1; done'
    - dotnet ef database update --project "$PROJECT_PATH" --connection "$DATABASE_URL"
  needs: ["build"]

deploy_to_staging:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet publish "$PROJECT_PATH" --configuration Release --output ./publish
    - echo "Deploying to staging environment..."
    # Add your actual deployment commands here (e.g., kubectl, docker push, etc.)
  environment:
    name: staging
    url: https://staging.yourproject.com
  only:
    - main
  variables:
    ASPNETCORE_ENVIRONMENT: "Staging"
    ConnectionStrings__TaskboardDb: $STAGING_DB_CONNECTION_STRING # Defined in GitLab CI/CD variables

deploy_to_production:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet publish "$PROJECT_PATH" --configuration Release --output ./publish
    - echo "Deploying to production environment..."
    # Add your actual deployment commands here
  environment:
    name: production
    url: https://yourproject.com
  when: manual
  only:
    - tags
  variables:
    ASPNETCORE_ENVIRONMENT: "Production"
    ConnectionStrings__TaskboardDb: $PRODUCTION_DB_CONNECTION_STRING # Defined in GitLab CI/CD variables