name: taskboard-project
services:
  taskboard-db:
    container_name: Database
    image: postgres:latest
    restart: on-failure
    environment: 
      - POSTGRES_DB=taskboardDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5433
    ports:
      - "5433:5433"
    volumes:
      - postgres-database:/var/lib/postgresql/data
    networks: 
      - taskboard-net
  
  dotnet-webapi: 
    container_name: userService-webapi
    depends_on:
      - taskboard-db
    build: 
      context: .
      dockerfile: /UserService.Api/Dockerfile
    networks: 
      - taskboard-net
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__TaskboardDb=Host=Database;Username=postgres;Password=postgres;Database=taskboardDb;
    ports:
      - "7080:8080"
      - "7081:8081"

networks:
  taskboard-net:
    driver: bridge  

volumes: 
  postgres-database: