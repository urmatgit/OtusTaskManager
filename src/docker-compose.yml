name: taskboard-project
services:
  taskboard-db:
    container_name: Postgrebase
    image: postgres:latest
    restart: on-failure
    environment: 
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5433
      - POSTGRES_MULTIPLE_DATABASES= taskboardDb,keycloakdb
      - POSTGRES_MULTIPLE_USERS= postgres,postgres
      - POSTGRES_MULTIPLE_PASSWORDS= postgres,postgres
    ports:
      - "5433:5433"
    
    volumes:
      - postgres-database:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks: 
      - taskboard-net
  keycloak:
    container_name: keycloak_web
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://Postgrebase:5433/keycloakdb
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      PROXY_ADDRESS_FORWARDING: true
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_HTTP_PORT: 9080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
    ports:
      - "9080:9080"      
    networks: 
      - taskboard-net
  #PowerShell Генерировать сертифиакат на локальном компьютере
#dotnet dev-certs https -ep "$env:USERPROFILE\.aspnet\https\aspnetapp.pfx"  -p taskboardSert1
#dotnet dev-certs https --trust
  dotnet-webapi: 
    container_name: userService-webapi
    depends_on:
      - taskboard-db
    build: 
      context: .
      dockerfile: Dockerfile
    networks: 
      - taskboard-net
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=taskboardSert1
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__TaskboardDb=Host=Postgrebase;Username=postgres;Password=postgres;Database=taskboardDb;Port=5433;
    ports:
      - "7080:8080"
      - "7081:8081"
    restart: always
    volumes:
      - ~/.aspnet/https:/https:ro
  rabbit:
    image: rabbitmq:4-management
    restart: always
    hostname: rabbitmqhost    
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

networks:
  taskboard-net:
    driver: bridge  

volumes: 
  postgres-database:
  rabbitmq_data: